<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDR BASE | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css?v=4.5">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-shield-virus"></i>
        </div>

        <h1>XDR BASE</h1>
        <span class="brand-sub">Security Operations Center</span>
        <p class="subtitle">Autonomous Security & Extended Threat Response</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username / Operator ID" autocomplete="username">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Passcode / Security Token" autocomplete="current-password">
            <i class="fa-solid fa-lock"></i>
        </div>

        <button type="button" onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Authenticate to SOC</span>
        </button>

        <p id="message"></p>

        <div class="secure">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Zero-Trust Enterprise Authentication Active</span>
        </div>

        <div class="login-footer">
            XDR BASE Platform v1.0
            <br>
            Powered by <strong>FastAPI</strong> • <strong>PostgreSQL</strong> • <strong>OpenSearch</strong>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
