services:

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: nexa-backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - opensearch

  postgres:
    image: postgres:17

    container_name: nexa-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_xdr}

    ports:
      - "5432:5432"

  opensearch:
    image: opensearchproject/opensearch:2.19.1

    container_name: nexa-opensearch

    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-AdminPassword123!}

    ports:
      - "9200:9200"