services:

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xdr-backend
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexa_xdr}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SecOps#XDR2026!}
      - OPENSEARCH_USE_SSL=true
      - OPENSEARCH_VERIFY_CERTS=false
    depends_on:
      - postgres
      - opensearch

  postgres:
    image: postgres:17
    container_name: xdr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_xdr}
    volumes:
      - xdr_postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5439:5432"

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: xdr-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SecOps#XDR2026!}
    volumes:
      - xdr_opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

volumes:
  xdr_postgres_data:
  xdr_opensearch_data: